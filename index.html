<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>r/place Canlı Tuval</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: crosshair;
    }
    canvas {
      background-color: #ffffff;
      image-rendering: pixelated;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #palette {
      position: fixed;
      bottom: 20px;
      background: rgba(30, 30, 30, 0.9);
      padding: 10px 15px;
      border-radius: 30px;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid #333;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.active { border-color: #fff; transform: scale(1.2); }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="canvas" width="500" height="500"></canvas>
  </div>

  <div id="palette"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const palette = document.getElementById('palette');

    const colors = [
      '#6D001A', '#BE0039', '#FF4500', '#FFA800', '#FFD635',
      '#00A368', '#00CC78', '#7EED56', '#00756F', '#009EAA',
      '#2450A4', '#3690EA', '#51E9F4', '#493AC1', '#6A5CFF',
      '#811E9F', '#B44AC0', '#FF99AA', '#9C6926', '#000000',
      '#898D90', '#D4D7D9', '#FFFFFF'
    ];

    let selectedColor = colors[1]; // Varsayılan renk (kırmızı)

    // Paleti oluştur
    colors.forEach(color => {
      const btn = document.createElement('div');
      btn.className = 'color-btn';
      btn.style.backgroundColor = color;
      if (color === selectedColor) btn.classList.add('active');
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = color;
      });
      palette.appendChild(btn);
    });

    // Piksel Çizme Fonksiyonu
    function drawPixel(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }

    // Sayfa Yüklenince Tüm Pikselleri Veritabanından Çek
    async function loadPixels() {
      try {
        const res = await fetch('/api/draw');
        if (res.ok) {
          const pixels = await res.json();
          pixels.forEach(p => drawPixel(p.x, p.y, p.color));
        }
      } catch (err) {
        console.error("Pikseller yüklenirken hata:", err);
      }
    }

    // Tıklayınca Çiz ve Sunucuya Gönder
    canvas.addEventListener('click', async (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      if (x >= 0 && x < 500 && y >= 0 && y < 500) {
        drawPixel(x, y, selectedColor);

        try {
          await fetch('/api/draw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ x, y, color: selectedColor })
          });
        } catch (err) {
          console.error("Piksel kaydedilemedi:", err);
        }
      }
    });

    // Pusher ile Canlı Senkronizasyon Bağlantısı
    const pusher = new Pusher('0a3dfb70efecb620ea79', { cluster: 'eu' });
    const channel = pusher.subscribe('rplace-channel');
    channel.bind('pixel-placed', function(data) {
      drawPixel(data.x, data.y, data.color);
    });

    // Başlangıçta verileri yükle
    loadPixels();
  </script>
</body>
</html>
