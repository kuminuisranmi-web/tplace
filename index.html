<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>r/place Canlı Tuval</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #viewport:active { cursor: grabbing; }
    canvas {
      background-color: #ffffff;
      image-rendering: pixelated;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #palette {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      padding: 10px 15px;
      border-radius: 30px;
      display: flex;
      gap: 10px;
      backdrop-filter: blur(5px);
      border: 1px solid #333;
      z-index: 100;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-btn:hover { transform: scale(1.15); }
    .color-btn.active { border-color: #fff; transform: scale(1.2); }
  </style>
</head>
<body>

  <div id="viewport">
    <canvas id="canvas" width="500" height="500"></canvas>
  </div>

  <div id="palette"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');
    const palette = document.getElementById('palette');

    const colors = [
      '#6D001A', '#BE0039', '#FF4500', '#FFA800', '#FFD635',
      '#00A368', '#00CC78', '#7EED56', '#00756F', '#009EAA',
      '#2450A4', '#3690EA', '#51E9F4', '#493AC1', '#6A5CFF',
      '#811E9F', '#B44AC0', '#FF99AA', '#9C6926', '#000000',
      '#898D90', '#D4D7D9', '#FFFFFF'
    ];
    let selectedColor = colors[1];

    colors.forEach(color => {
      const btn = document.createElement('div');
      btn.className = 'color-btn';
      btn.style.backgroundColor = color;
      if (color === selectedColor) btn.classList.add('active');
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = color;
      });
      palette.appendChild(btn);
    });

    // Zoom & Kaydırma
    let scale = 1.5;
    let panX = (window.innerWidth - 500 * scale) / 2;
    let panY = (window.innerHeight - 500 * scale) / 2;
    let isDragging = false;
    let startX = 0, startY = 0;
    let hasMoved = false;

    function updateTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    updateTransform();

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.1;
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      let newScale = e.deltaY < 0 ? Math.min(scale * zoomFactor, 20) : Math.max(scale / zoomFactor, 0.5);
      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        hasMoved = false;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - startX - panX;
        const dy = e.clientY - startY - panY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    function drawPixel(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }

    // Beklemeden Tıklayınca Anında Çiz
    viewport.addEventListener('click', async (e) => {
      if (hasMoved) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const x = Math.floor(clickX / scale);
      const y = Math.floor(clickY / scale);

      if (x >= 0 && x < 500 && y >= 0 && y < 500) {
        drawPixel(x, y, selectedColor);

        try {
          await fetch('/api/draw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ x, y, color: selectedColor })
          });
        } catch (err) {
          console.error("Kayıt hatası:", err);
        }
      }
    });

    // Supabase Verilerini Yükle
    async function loadPixels() {
      try {
        const res = await fetch('/api/draw');
        if (res.ok) {
          const pixels = await res.json();
          pixels.forEach(p => drawPixel(p.x, p.y, p.color));
        }
      } catch (err) {
        console.error("Yükleme hatası:", err);
      }
    }

    // Pusher Canlı Yayın
    const pusher = new Pusher('0a3dfb70efecb620ea79', { cluster: 'eu' });
    const channel = pusher.subscribe('rplace-channel');
    channel.bind('pixel-placed', function(data) {
      drawPixel(data.x, data.y, data.color);
    });

    loadPixels();
  </script>
</body>
</html>
